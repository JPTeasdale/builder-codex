[package]
name = "ultralint"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4"
jsonc-parser = { version = "0.33.0", features = ["serde", "serde_json"] }
jsonschema = { version = "0.46.8", default-features = false }
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_ast_visit = "0.139.0"
oxc_parser = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
